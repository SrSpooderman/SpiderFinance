name: CI y releases

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spiderfinance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publication' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pruebas y arranque Docker
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      CORS_ORIGINS: http://localhost:8080
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: ci-only-admin-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Pruebas del backend y versionado
        run: |
          python -m pip install -r backend/requirements-dev.txt
          (cd backend && python -m pytest -q)
          python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilación del frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Arranque completo con PostgreSQL
        run: |
          docker compose config --quiet
          docker compose -f compose.managed.yaml config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          curl --fail --silent --show-error http://localhost:8080/api/ > /dev/null
          curl --fail --silent --show-error http://localhost:8080/api/v1/auth/config > /dev/null
          curl --fail --silent --show-error http://localhost:8081/admin > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/admin)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/v1/admin/users)" = 404
          curl --fail --silent --show-error http://localhost:8081/api/v1/admin/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"ci-only-admin-password-long-enough"}' > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/docs)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/openapi.json)" = 404
      - name: Apagar instalación de prueba
        if: always()
        run: docker compose down -v

  version:
    name: Determinar etiqueta
    needs: verify
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag || steps.supplied.outputs.tag }}
      existing_tag: ${{ steps.next.outputs.existing_tag || steps.supplied.outputs.existing_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Calcular versión tras un push a la rama principal
        id: next
        if: github.ref_type == 'branch'
        run: python scripts/release_version.py --next >> "$GITHUB_OUTPUT"
      - name: Validar etiqueta enviada manualmente
        id: supplied
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_version.py --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar imágenes en GHCR
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_root: ${{ steps.names.outputs.root }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombres y etiquetas de imágenes
        id: names
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          root="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          {
            echo 'backend<<EOF'
            echo "$root/backend:$RELEASE_TAG"
            if [[ "$GITHUB_REF_TYPE" == 'branch' ]]; then echo "$root/backend:latest"; fi
            echo 'EOF'
            echo 'frontend<<EOF'
            echo "$root/frontend:$RELEASE_TAG"
            if [[ "$GITHUB_REF_TYPE" == 'branch' ]]; then echo "$root/frontend:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend amd64 y arm64
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.backend }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend amd64 y arm64
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.frontend }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  release:
    name: Crear etiqueta y GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Crear etiqueta automática tras publicar las imágenes
        if: github.ref_type == 'branch' && needs.version.outputs.existing_tag != 'true'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Crear release y adjuntar referencias inmutables de Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          IMAGE_ROOT: ${{ needs.publish.outputs.image_root }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = os.environ['IMAGE_ROOT']
          data = {
              'tag': os.environ['RELEASE_TAG'],
              'backend': f"{root}/backend@{os.environ['BACKEND_DIGEST']}",
              'frontend': f"{root}/frontend@{os.environ['FRONTEND_DIGEST']}",
          }
          Path('docker-images.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          gh release upload "$RELEASE_TAG" docker-images.json --clobber
