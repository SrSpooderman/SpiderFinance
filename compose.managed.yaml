# Para gestores que enrutan al puerto interno del contenedor frontend.
# No publica puertos del host; asigna el dominio completo a frontend:80.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spiderfinance}
      POSTGRES_USER: ${POSTGRES_USER:-spiderfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spiderfinance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfinance}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
